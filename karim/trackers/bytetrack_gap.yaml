# Strict ByteTrack settings — reduces ID swaps between nearby animals.
# Note: 08_cursor_tracking.py uses custom motion association instead;
# this file is kept for manual experiments with model.track().

tracker_type: bytetrack
track_high_thresh: 0.30
track_low_thresh: 0.10
new_track_thresh: 0.45
track_buffer: 25
match_thresh: 0.85
fuse_score: True
