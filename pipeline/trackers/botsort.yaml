# BoT-SORT for stabilized thermal drone sequences.
# GMC is off — camera motion is already removed during stabilization.

tracker_type: botsort
track_high_thresh: 0.3
track_low_thresh: 0.1
new_track_thresh: 0.4    # Lowered: keeps track alive through thermal flicker
track_buffer: 45          # 45 frames at 3 FPS is 15 seconds of memory window
match_thresh: 0.75        # Tighten to prevent distant objects from stealing IDs
proximity_thresh: 0.7
appearance_thresh: 0.0    # Absolute zero to force motion-only tracking
with_reid: False          # False -> thermal images are too noisy for ReID
model: auto
fuse_score: True
gmc_method: None