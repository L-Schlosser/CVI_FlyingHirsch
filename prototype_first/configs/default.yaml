project:
  name: flyinghirsch

paths:
  data_dir: data
  artifacts_dir: artifacts
  reports_dir: reports

dataset:
  # Put your dataset-specific settings here
  raw_subdir: raw
  processed_subdir: processed
  # Expected source layout (relative to project root by default):
  # data/raw/dataset/{images,labels}/{train,val,test}
  default_src: data/raw/dataset
  # Where the CLI will stage the dataset under data/ by default:
  default_staged: data/processed/dataset

train:
  seed: 42

yolo:
  # Ultralytics model to start from (nano by default for speed)
  model: yolov8n.pt
  imgsz: 640
  epochs: 50
  batch: 16
  workers: 4
  # device: "0"   # set to GPU index, or "cpu"
  patience: 20
  # run outputs go here:
  project: artifacts/yolo
  name: run

inference:
  score_threshold: 0.5
  iou_threshold: 0.7
  max_det: 300

analysis:
  # If you analyze a video produced by scripts.predict, set fps to the source fps.
  fps: 30.0
  # Optional calibration: pixels per meter (if you know it)
  # pixels_per_meter: 100.0
